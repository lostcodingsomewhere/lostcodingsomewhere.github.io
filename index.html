<style>
:root{--ink:#0D1015;--panel:#151A22;--panel2:#1B212C;--line:#28303D;--text:#ECEFF4;--muted:#8B94A5;--dim:#5A6373;--signal:#FFC53D;--calm:#4FD1C5;--cool:#6E9BFF;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text)}
body{font-family:"Space Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45;max-width:560px;margin:0 auto;padding-bottom:calc(60px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0}
.brand .sub{font-family:"Space Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.05em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px 7px;text-align:center;cursor:pointer;color:var(--muted);transition:.18s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none}
.tab:active{transform:scale(.94)}
.tab .dnum{font-family:"Space Mono",monospace;font-weight:700;font-size:18px;line-height:1}
.tab .dtype{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.tab.info{min-width:auto;padding:8px 14px;justify-content:center}.tab.info .dnum{font-size:13px;letter-spacing:.1em}
.tab[data-type="work"] .dtype{background:var(--signal)}.tab[data-type="recovery"] .dtype{background:var(--calm)}
.tab.active{color:var(--text)}
.tab.active[data-type="work"]{border-color:var(--signal);background:rgba(255,197,61,.12)}
.tab.active[data-type="recovery"]{border-color:var(--calm);background:rgba(79,209,197,.12)}
.tab.active.info{border-color:var(--cool);background:rgba(110,155,255,.12)}
main{padding:18px 16px 0}
.dayhead{margin-bottom:14px}
.dayhead .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dayhead .kw{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--dim)}
.chip-tag{font-family:"Space Mono",monospace;font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid}
.work .chip-tag{color:var(--signal);border-color:rgba(255,197,61,.4)}.recovery .chip-tag{color:var(--calm);border-color:rgba(79,209,197,.4)}
.dayhead h2{font-size:26px;font-weight:700;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}
.tophint{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 16px}

DAYS.forEach(d=>{const b=document.createElement('button');b.className='tab';b.dataset.type=d.type;b.dataset.n=d.n;
 b.innerHTML='<span class="dnum">'+WD2[d.n-1]+'</span><span class="dtype"></span>';
 b.setAttribute('aria-label',WDL[d.n-1]+': '+d.name);b.onclick=()=>select(d.n);tabsEl.appendChild(b);});
const info=document.createElement('button');info.className='tab info';info.dataset.n='info';
info.innerHTML='<span class="dnum">INFO</span>';info.onclick=()=>select('info');tabsEl.appendChild(info);

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function firstInt(s){const m=(s||'').match(/^\s*(\d+)/);return m?parseInt(m[1]):0}
function tierKey(ctx){return 'tspec:tier:'+ctx}
function tickKey(ctx,t){return 'tspec:tick:'+ctx+':'+t}

function slide(t,ctx,tier){
 const [nm,sets,tempo,rest,sub,note]=t;
 let h='<div style="padding:2px 2px 0">';
 h+='<div class="exname"><div class="nm">'+esc(nm)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>';
 h+='<div class="data"><div class="stat reps"><span class="k">Sets × Reps</span><span class="v">'+esc(sets||'—')+'</span></div>';
 if(tempo)h+='<div class="stat"><span class="k">Tempo</span><span class="v">'+esc(tempo)+'</span></div>';
 if(rest)h+='<div class="stat"><span class="k">Rest</span><span class="v">'+esc(rest)+'</span></div>';
 h+='</div>';
 if(note)h+='<div class="note">'+esc(note)+'</div>';
 const n=firstInt(sets);
 if(n&&n<=8){const st=LS.get(tickKey(ctx,tier),[]);h+='<div class="dots"><span class="dlbl">Done</span>';
  for(let i=0;i<n;i++)h+='<button class="dot '+(st[i]?'on':'')+'" data-ctx="'+ctx+'" data-tier="'+tier+'" data-i="'+i+'" aria-label="Set '+(i+1)+'"></button>';
  h+='</div>';}
 return h+'</div>';
}
function timerHTML(ctx){return '<div class="timer" data-ctx="'+ctx+'"><span class="tlabel"></span><span class="tdisp">0:00</span><button class="tbtn tstart">Start</button><button class="tbtn treset" aria-label="Reset timer">↺</button></div>';}
function tierIcon(i){
 const filled=3-i,bars=[[0,8,6],[7,4,10],[14,0,14]];
 let r='';bars.forEach((b,j)=>{r+='<rect x="'+b[0]+'" y="'+b[1]+'" width="4" height="'+b[2]+'" rx="1.3"'+(j<filled?'':' opacity=".25"')+'/>';});
 return '<svg class="tico" viewBox="0 0 18 14" fill="currentColor" aria-hidden="true">'+r+'</svg>';
}
function exCard(item,ctx){
 const cur=Math.min(2,Math.max(0,LS.get(tierKey(ctx),0)));
 const opt=item.optional?' optional':'';
 const flag=item.optional?'<span class="optflag">optional</span>':'';
 let segs='<div class="tierbar">';
 item.tiers.forEach((t,i)=>segs+='<button class="seg '+(i===cur?'on':'')+'" data-ctx="'+ctx+'" data-t="'+i+'" aria-label="'+TL[i]+'" title="'+TL[i]+'">'+tierIcon(i)+'</button>');
 segs+='</div>';
 let slides='';item.tiers.forEach((t,i)=>slides+='<div class="tierslide">'+slide(t,ctx,i)+'</div>');
 return '<div class="card'+opt+'" data-ctx="'+ctx+'"><div class="cardtop"><span class="mark">'+esc(item.mark)+'</span>'+flag+segs+'</div>'+
  '<div class="tierview"><div class="tiertrack" style="transform:translateX('+(-cur*33.3333)+'%)">'+slides+'</div></div>'+timerHTML(ctx)+'</div>';
}
function renderDay(d){
 let h='<div class="dayhead '+d.type+'"><div class="eyebrow"><span class="kw">'+esc(WDL[d.n-1].toUpperCase())+'</span><span class="chip-tag">'+esc(d.tag)+'</span></div><h2>'+esc(d.name)+'</h2></div>';
 if(d.rest&&!d.blocks){
  const sents=String(d.rest).split('. ').map((s,i,a)=>i<a.length-1?s+'.':s).filter(Boolean);
  return h+'<div class="restday"><div class="big">'+esc(d.name)+'</div>'+
   sents.map((s,i)=>'<p'+(i===0?' class="lead"':'')+'>'+esc(s)+'</p>').join('')+
   timerHTML('rec-'+d.n)+'</div>';
 }
 h+='<div class="dayswitch'+(d.metcon?' metcon':'')+'"><span class="lbl">Set all levels</span><div class="segs">'+
  TL.map((t,i)=>'<button class="dseg" data-t="'+i+'" aria-label="'+t+'" title="'+t+'">'+tierIcon(i)+'</button>').join('')+'</div></div>';
 h+='<div class="tophint"><span class="h">Or swipe / tap a single card. Levels &amp; ticks save on this device.</span><button class="resetbtn" id="resetDay">Reset ticks</button></div>';
 if(d.warmup){const wp=String(d.warmup).split('·').map(s=>s.trim()).filter(Boolean);
  h+='<div class="warmup"><div class="lbl">Warm-up</div>'+
   (wp.length>1?'<ul class="warmlist">'+wp.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':'<p>'+esc(d.warmup)+'</p>')+'</div>';}
 h+=d.metcon?'<div class="metcon">':'<div>';
 d.blocks.forEach((blk,bi)=>{
  if(blk.superset){h+='<div class="superset"><div class="ss-tag"><span class="t">⌇ Superset</span><span class="rounds">'+esc(blk.superset)+'</span>'+(blk.title?'<span class="ss-title">'+esc(blk.title)+'</span>':'')+'</div>';
   blk.items.forEach((it,ii)=>h+=exCard(it,d.n+'-'+bi+'-'+ii));h+='</div>';}
  else{if(blk.title)h+='<div class="blocklabel"><span class="ss-title">'+esc(blk.title)+'</span></div>';
   blk.items.forEach((it,ii)=>h+=exCard(it,d.n+'-'+bi+'-'+ii));}
 });
 return h+'</div>';
}
function renderInfo(){return `
<div class="dayhead"><div class="eyebrow"><span class="kw">REFERENCE</span></div><h2>How it works</h2></div>
<div class="infoblock"><h3 class="coolhead">Levels &amp; memory</h3><div class="def"><div class="desc">Swipe a card or tap the <b>difficulty meter</b> (3 bars = advanced, 1 bar = easiest) to change level — each is a real regression movement. Your chosen level and every set tick are <b>saved on this device</b> and restored next time you open it.</div></div></div>
<div class="infoblock"><h3>Legend</h3><div class="deflist">
<div class="def"><div class="term">Tempo e-p-c-p</div><div class="desc">Seconds: eccentric · pause (bottom) · concentric · pause (top). <b>X</b> = explosive.</div></div>
<div class="def"><div class="term">RIR</div><div class="desc">Reps in reserve — lower = harder.</div></div>
<div class="def"><div class="term">⌇ Superset</div><div class="desc">Bracketed moves run back-to-back for the same rounds; rest after the pair.</div></div>
<div class="def"><div class="term">Power work</div><div class="desc">Always quality-based. Stop when height or speed drops.</div></div></div></div>
<div class="infoblock"><h3>The one principle</h3><div class="principle">
<p><b>Lengthened-position bias.</b> Favor the variation that loads the muscle stretched, and control the eccentric to reach it.</p>
<p class="gov">Governor: for hamstrings the stretched position is the most productive AND the most injury-relevant — add range gradually.</p></div></div>
<div class="infoblock"><h3 class="coolhead">Sequencing</h3><ul class="rules">
<li>Three hamstring stressors 48h apart: plyos (Mon) → heavy hinge + Nordics (Wed) → swings (Fri).</li>
<li>Hardest eccentric day (Wed) → zero-impact recovery (Thu).</li>
<li>Power before conditioning; power before fatigue.</li>
<li>Sprints: Monday only, fresh and unloaded.</li>
<li>Core = anti-movement + rotational power.</li></ul></div>
<div class="infoblock"><h3>Progression</h3><table class="prog">
<tr><th>Block</th><th>Main lifts</th><th>Power</th><th>Metcon</th></tr>
<tr><td>Wk 1–3</td><td>RIR 3–4</td><td>quality</td><td>4 rounds</td></tr>
<tr><td>Wk 4–6</td><td>RIR 2–3 +load</td><td>+1 rep</td><td>5 rounds</td></tr>
<tr><td>Wk 7+</td><td>RIR 1–2</td><td>+height</td><td>cut rest OR add load</td></tr></table>
<p style="font-size:13px;color:var(--muted);margin-top:10px">Deload every 4–6 wks: volume −40%, keep intensity.</p></div>
<div class="infoblock"><h3 class="recoveryhead">4-day version</h3><div class="def"><div class="desc">Keep <b>Mon / Wed / Fri</b> + one easy aerobic day.</div></div></div>
<div class="infoblock"><h3>Data</h3><button class="dangerbtn" id="wipe">Clear all saved levels &amp; ticks</button></div>`;
}
/* ---- keep-awake + workout spotlight ---- */
function acquireWake(){try{if('wakeLock'in navigator&&!wakeLock){navigator.wakeLock.request('screen').then(w=>{wakeLock=w;w.addEventListener('release',()=>{wakeLock=null;});}).catch(()=>{});}}catch(e){}}
function releaseWake(){try{if(wakeLock){const w=wakeLock;wakeLock=null;w.release().catch(()=>{});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&TMR&&TMR.running)acquireWake();});
function enterFocus(ctx){
 document.body.classList.add('timing');
 viewEl.querySelectorAll('.focus').forEach(c=>c.classList.remove('focus'));
 const t=viewEl.querySelector('.timer[data-ctx="'+ctx+'"]'),host=t&&t.closest('.card,.restday');
 if(host)host.classList.add('focus');
 window.scrollTo(0,0);
}
function exitFocus(){document.body.classList.remove('timing');viewEl.querySelectorAll('.focus').forEach(c=>c.classList.remove('focus'));}
/* ---- timers ---- */
function parseSeconds(str){
 if(!str)return null;
 const m=String(str).match(/(\d+(?:\.\d+)?)(?:\s*[–-]\s*\d+(?:\.\d+)?)?\s*(min|sec|s)\b/i);
 if(!m)return null;
 const v=parseFloat(m[1]);return Math.round(m[2].toLowerCase().indexOf('min')===0?v*60:v);
}
function intervalSpec(str){
 if(!str)return null;let m;
 if((m=String(str).match(/emom\s*(\d+)\s*min/i)))return{name:'EMOM',rounds:+m[1],phases:[{label:'GO',sec:60}]};
 if((m=String(str).match(/(\d+)\s*[×x]\s*\(?\s*(\d+)\s*s[^\/)]*\/\s*(\d+)\s*s\s*rest/i)))return{name:'INTERVAL',rounds:+m[1],phases:[{label:'WORK',sec:+m[2]},{label:'REST',sec:+m[3]}]};
 return null;
}
function timerSpecFor(ctx){
 if(String(ctx).indexOf('rec')===0)return{mode:'up',label:'ELAPSED',seconds:0};
 const p=String(ctx).split('-'),day=DAYS.find(x=>x.n===+p[0]);
 const item=day&&day.blocks&&day.blocks[+p[1]]&&day.blocks[+p[1]].items[+p[2]];
 if(!item)return{mode:'up',label:'TIMER',seconds:0};
 const tier=Math.min(2,Math.max(0,LS.get(tierKey(ctx),0)));
 const t=item.tiers[tier],sets=t[1],rest=t[3],note=t[5];
 const iv=intervalSpec(note)||intervalSpec(sets);
 if(iv)return{mode:'interval',label:iv.name,rounds:iv.rounds,phases:iv.phases};
 const work=parseSeconds(sets);if(work)return{mode:'down',label:'WORK',seconds:work};
 const r=parseSeconds(rest);if(r)return{mode:'down',label:'REST',seconds:r};
 return{mode:'up',label:'TIMER',seconds:0};
}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function ensureAC(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!timerAC)timerAC=new AC();if(timerAC.state==='suspended')timerAC.resume();}catch(e){}}
function beep(kind){
 try{if(timerAC){const o=timerAC.createOscillator(),g=timerAC.createGain();o.connect(g);g.connect(timerAC.destination);
  const now=timerAC.currentTime,f=kind==='end'?880:kind==='phase'?660:520;o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.35,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.4);
  o.start(now);o.stop(now+.42);}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(kind==='end'?[120,60,120]:60);}catch(e){}
}
function timerSetIdle(el,ctx){
 const s=timerSpecFor(ctx);el.classList.remove('running','paused','done');
 el.querySelector('.tlabel').textContent=s.mode==='interval'?(s.phases[0].label+' 1/'+s.rounds):s.label;
 el.querySelector('.tdisp').textContent=s.mode==='up'?'0:00':fmt(s.mode==='interval'?s.phases[0].sec:s.seconds);
 el.querySelector('.tstart').textContent='Start';
}
function timerEl(){return TMR?document.querySelector('.timer[data-ctx="'+TMR.ctx+'"]'):null;}
function paintTimer(){
 const el=timerEl();if(!el)return;
 el.classList.add('running');el.classList.toggle('paused',!TMR.running&&!TMR.done);el.classList.toggle('done',!!TMR.done);
 const disp=el.querySelector('.tdisp'),lbl=el.querySelector('.tlabel'),st=el.querySelector('.tstart');
 if(TMR.mode==='up'){disp.textContent=fmt(TMR.elapsed);lbl.textContent=TMR.done?'DONE':'ELAPSED';}
 else if(TMR.mode==='interval'){disp.textContent=fmt(Math.max(0,TMR.remaining));lbl.textContent=TMR.done?'DONE':(TMR.spec.phases[TMR.phaseIdx].label+' '+TMR.round+'/'+TMR.spec.rounds);}
 else{disp.textContent=fmt(Math.max(0,TMR.remaining));lbl.textContent=TMR.done?'DONE':TMR.label;}
 st.textContent=TMR.done?'Restart':(TMR.running?'Pause':'Resume');
}
function stopTimer(){
 if(!TMR)return;const prev=TMR.ctx;if(TMR.iv)clearInterval(TMR.iv);TMR=null;releaseWake();exitFocus();
 const el=document.querySelector('.timer[data-ctx="'+prev+'"]');if(el)timerSetIdle(el,prev);
}
function startTimer(ctx){
 stopTimer();const spec=timerSpecFor(ctx);
 TMR={ctx,mode:spec.mode,label:spec.label,spec,phaseIdx:0,round:1,running:true,done:false};
 if(spec.mode==='up'){TMR.elapsed=0;TMR.startedAt=Date.now();}
 else if(spec.mode==='interval'){TMR.remaining=spec.phases[0].sec;TMR.endAt=Date.now()+TMR.remaining*1000;}
 else{TMR.remaining=spec.seconds||0;TMR.endAt=Date.now()+TMR.remaining*1000;}
 ensureAC();acquireWake();TMR.iv=setInterval(timerTick,200);enterFocus(ctx);paintTimer();
}
function pauseTimer(){
 if(!TMR)return;if(TMR.mode==='up')TMR.elapsed=(Date.now()-TMR.startedAt)/1000;else TMR.remaining=(TMR.endAt-Date.now())/1000;
 TMR.running=false;if(TMR.iv)clearInterval(TMR.iv);TMR.iv=null;releaseWake();paintTimer();
}
function resumeTimer(){
 if(!TMR)return;TMR.running=true;ensureAC();acquireWake();
 if(TMR.mode==='up')TMR.startedAt=Date.now()-TMR.elapsed*1000;else TMR.endAt=Date.now()+TMR.remaining*1000;
 TMR.iv=setInterval(timerTick,200);paintTimer();
}
function resetTimer(ctx){
 if(TMR&&TMR.ctx===ctx){stopTimer();return;}
 const el=document.querySelector('.timer[data-ctx="'+ctx+'"]');if(el)timerSetIdle(el,ctx);
}
function timerTick(){
 if(!TMR||!TMR.running)return;const now=Date.now();
 if(TMR.mode==='up'){TMR.elapsed=(now-TMR.startedAt)/1000;paintTimer();return;}
 const rem=(TMR.endAt-now)/1000;
 if(rem>0){TMR.remaining=rem;paintTimer();return;}
 if(TMR.mode==='interval'){
  if(TMR.phaseIdx<TMR.spec.phases.length-1)TMR.phaseIdx++;else{TMR.phaseIdx=0;TMR.round++;}
  if(TMR.round>TMR.spec.rounds){beep('end');TMR.remaining=0;TMR.done=true;TMR.running=false;clearInterval(TMR.iv);TMR.iv=null;releaseWake();paintTimer();return;}
  beep('phase');TMR.remaining=TMR.spec.phases[TMR.phaseIdx].sec;TMR.endAt=now+TMR.remaining*1000;paintTimer();
 }else{beep('end');TMR.remaining=0;TMR.done=true;TMR.running=false;clearInterval(TMR.iv);TMR.iv=null;releaseWake();paintTimer();}
}
function select(n){
 current=n;LS.set('tspec:day',n);
 if(TMR){if(TMR.iv)clearInterval(TMR.iv);TMR=null;releaseWake();}
 exitFocus();
 [...tabsEl.children].forEach(t=>t.classList.toggle('active',t.dataset.n==String(n)));
 if(n==='info'){viewEl.innerHTML=renderInfo();const w=document.getElementById('wipe');if(w)w.onclick=wipeAll;}
 else{viewEl.innerHTML=renderDay(DAYS.find(d=>d.n===n));bindDay();}
 viewEl.style.animation='none';void viewEl.offsetWidth;viewEl.style.animation='';
 window.scrollTo(0,0);
}
function setTier(ctx,t){
 t=Math.max(0,Math.min(2,t));LS.set(tierKey(ctx),t);
 const card=viewEl.querySelector('.card[data-ctx="'+ctx+'"]');if(!card)return;
 card.querySelector('.tiertrack').style.transform='translateX('+(-t*33.3333)+'%)';
 card.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('on',i===t));
 if(!(TMR&&TMR.ctx===ctx)){const tel=card.querySelector('.timer');if(tel)timerSetIdle(tel,ctx);}
 refreshDaySwitch();
}
function setAllTiers(t){
 t=Math.max(0,Math.min(2,t));
 const d=DAYS.find(x=>x.n===current);if(!d||!d.blocks)return;
 d.blocks.forEach((blk,bi)=>blk.items.forEach((it,ii)=>setTier(d.n+'-'+bi+'-'+ii,t)));
 refreshDaySwitch();
}
function refreshDaySwitch(){
 const bar=viewEl.querySelector('.dayswitch');if(!bar)return;
 const d=DAYS.find(x=>x.n===current);if(!d||!d.blocks)return;
 const tiers=[];d.blocks.forEach((blk,bi)=>blk.items.forEach((it,ii)=>tiers.push(Math.min(2,Math.max(0,LS.get(tierKey(d.n+'-'+bi+'-'+ii),0))))));
 const all=tiers.length&&tiers.every(x=>x===tiers[0])?tiers[0]:-1;
 bar.querySelectorAll('.dseg').forEach((s,i)=>s.classList.toggle('on',i===all));
}
function bindDay(){
 const rd=document.getElementById('resetDay');if(rd)rd.onclick=()=>resetDayTicks();
 viewEl.querySelectorAll('.dseg').forEach(s=>s.onclick=()=>setAllTiers(+s.dataset.t));
 refreshDaySwitch();
 viewEl.querySelectorAll('.timer').forEach(el=>{const ctx=el.dataset.ctx;timerSetIdle(el,ctx);
  el.querySelector('.tstart').onclick=()=>{if(TMR&&TMR.ctx===ctx&&!TMR.done){TMR.running?pauseTimer():resumeTimer();}else startTimer(ctx);};
  el.querySelector('.treset').onclick=()=>resetTimer(ctx);
  el.querySelector('.tdisp').onclick=()=>{if(TMR&&TMR.ctx===ctx)enterFocus(ctx);};});
 viewEl.querySelectorAll('.seg').forEach(s=>s.onclick=()=>setTier(s.dataset.ctx,+s.dataset.t));
 viewEl.querySelectorAll('.dot').forEach(dot=>dot.onclick=()=>{
  const k=tickKey(dot.dataset.ctx,dot.dataset.tier),i=+dot.dataset.i;
  const st=LS.get(k,[]);st[i]=!st[i];LS.set(k,st);
  dot.classList.toggle('on',st[i]);if(st[i]){dot.classList.remove('pop');void dot.offsetWidth;dot.classList.add('pop');}
 });
 viewEl.querySelectorAll('.card').forEach(card=>{
  const ctx=card.dataset.ctx,view=card.querySelector('.tierview'),track=card.querySelector('.tiertrack');
  if(!view||!track)return;let x0=null,y0=null,drag=false,w=0;
  view.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;drag=false;w=view.offsetWidth;},{passive:true});
  view.addEventListener('touchmove',e=>{if(x0==null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
   if(!drag&&Math.abs(dx)>Math.abs(dy)+4){drag=true;track.classList.add('dragging');}
   if(drag){const cur=LS.get(tierKey(ctx),0);let off=-cur*w+dx;off=Math.max(-2*w,Math.min(0,off));track.style.transform='translateX('+off+'px)';}},{passive:true});
  view.addEventListener('touchend',e=>{if(drag){const dx=e.changedTouches[0].clientX-x0;const cur=LS.get(tierKey(ctx),0);
   let t=cur;if(dx<-40)t=cur+1;else if(dx>40)t=cur-1;track.classList.remove('dragging');track.style.transform='';setTier(ctx,t);}x0=null;drag=false;});
 });
}
function resetDayTicks(){
 const d=DAYS.find(x=>x.n===current);if(!d||!d.blocks)return;
 d.blocks.forEach((blk,bi)=>blk.items.forEach((it,ii)=>{for(let t=0;t<3;t++)LS.del(tickKey(d.n+'-'+bi+'-'+ii,t));}));
 select(current);
}
function wipeAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('tspec:')&&k!=='tspec:day').forEach(k=>localStorage.removeItem(k));}catch(e){}select('info');alert('Cleared.');}
document.getElementById('exitFocus').onclick=exitFocus;
select(current);
</script>
</body></html>
