<style>
:root{--ink:#0D1015;--panel:#151A22;--panel2:#1B212C;--line:#28303D;--text:#ECEFF4;--muted:#8B94A5;--dim:#5A6373;--signal:#FFC53D;--calm:#4FD1C5;--cool:#6E9BFF;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text)}
body{font-family:"Space Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.45;max-width:560px;margin:0 auto;padding-bottom:calc(60px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0}
.brand .sub{font-family:"Space Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:.05em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px 7px;text-align:center;cursor:pointer;color:var(--muted);transition:.18s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none}
.tab:active{transform:scale(.94)}
.tab .dnum{font-family:"Space Mono",monospace;font-weight:700;font-size:18px;line-height:1}
.tab .dtype{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.tab.info{min-width:auto;padding:8px 14px;justify-content:center}.tab.info .dnum{font-size:13px;letter-spacing:.1em}
.tab[data-type="work"] .dtype{background:var(--signal)}.tab[data-type="recovery"] .dtype{background:var(--calm)}
.tab.active{color:var(--text)}
.tab.active[data-type="work"]{border-color:var(--signal);background:rgba(255,197,61,.12)}
.tab.active[data-type="recovery"]{border-color:var(--calm);background:rgba(79,209,197,.12)}
.tab.active.info{border-color:var(--cool);background:rgba(110,155,255,.12)}
main{padding:18px 16px 0}
.dayhead{margin-bottom:14px}
.dayhead .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dayhead .kw{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--dim)}
.chip-tag{font-family:"Space Mono",monospace;font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid}
.work .chip-tag{color:var(--signal);border-color:rgba(255,197,61,.4)}.recovery .chip-tag{color:var(--calm);border-color:rgba(79,209,197,.4)}
.dayhead h2{font-size:26px;font-weight:700;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}

otect the hamstring."]]}]}, {"items": [{"mark": "B", "tiers": [["Bulgarian Split Squat", "4×8", "3-1-1-0", "90–120s", "↑ pistol / shrimp", "Full depth — the stretch IS the point."], ["Goblet Squat", "4×8–10", "3-1-1-0", "90s", "", "Upright; let the pelvis move naturally."], ["Box Squat", "4×8–10", "2-1-1-0", "90s", "", "Sit to box — knee/depth friendly."]]}]}, {"items": [{"mark": "C", "tiers": [["Nordic Curl", "4×4–6", "4-0-X", "2 min", "eccentric-loaded", "Slow eccentric IS the point — never rush, never for time."], ["Band-assisted Nordic", "4×5–8", "4-0-X", "2 min", "", "Band takes the bottom range."], ["Stability-ball Hamstring Curls", "4×10–12", "2-1-2-0", "90s", "", "Knee-flexion + bridge; low strain."]]}]}, {"items": [{"mark": "D", "tiers": [["Weighted Back Extension", "3×12", "2-1-2-1", "90s", "", "Pause + squeeze at top."], ["Bodyweight Back Extension", "3×12–15", "2-1-2-1", "75s", "", "Control, no bounce."], ["Glute Bridge / Hip Thrust", "3×12–15", "2-1-2-1", "60s", "", "Floor-based, back-friendly."]]}]}, {"superset": "3 rounds", "title": "Ab / anti-rotation finisher", "items": [{"mark": "E1", "tiers": [["Standing Ab-Wheel Rollout", "3×6–8", "3-0-1", "—", "", "Ribs down, no low-back sag."], ["Kneeling Ab-Wheel Rollout", "3×8–10", "3-0-1", "—", "", "Shorter lever."], ["Front Plank", "3×30–45s", "hold", "—", "", "Squeeze glutes, brace."]]}, {"mark": "E2", "tiers": [["Half-kneeling Pallof Press", "3×10/side", "2-1-2 hold", "60s", "", "Resist rotation."], ["Tall-kneeling Pallof Press", "3×10/side", "2-1-2 hold", "60s", "", "Wider base, easier."], ["Standing Pallof Press", "3×10–12/side", "2-1-2 hold", "45s", "", "Lighter band."]]}]}]}, {"n": 4, "name": "Swim or Full Rest", "tag": "Zero-impact", "type": "recovery", "rest": "Zero-impact by design — placed right after your hardest eccentric day so the tissue recovers."}, {"n": 5, "name": "Explosive Conditioning", "tag": "Double-under centric", "type": "work", "metcon": true, "warmup": "As Day 1 potentiation.", "blocks": [{"items": [{"mark": "·", "tiers": [["Consecutive Broad Jumps / Bounding", "4×3", "X", "full recovery", "power primer", "Snappy, not fatiguing."], ["Standing Broad Jump", "4×3", "X", "full recovery", "", "Single jump, reset each rep."], ["Squat Jumps", "4×5", "X", "60s", "", "Vertical, soft landings."]]}]}, {"title": "A · Double-under engine block", "items": [{"mark": "A", "tiers": [["Double-Under Engine", "see note", "X", "", "pick one, alternate weekly", "EMOM 10 min — 45–55 DUs/min (adv: crossovers/triples on odd rounds). OR 8×(45s DUs / 15s rest)."], ["Double-Unders — short sets", "see note", "X", "", "", "10×(20–25 DUs / 30s rest). Unbroken quality over volume."], ["Single-Unders (fast)", "see note", "X", "", "", "10×(50 fast singles / 20s rest). Sprinkle in DU attempts."]]}]}, {"superset": "5 rounds", "title": "B · Ballistic couplet — rest to keep reps CLEAN (not AMRAP)", "items": [{"mark": "·", "tiers": [["Single-arm / Heavy KB Swings", "×15", "X", "", "", "Explosive hip snap."], ["Two-arm KB Swings", "×15", "X", "", "", "Chest-height; hinge not squat."], ["KB Hip Hinge (light)", "×15", "2-0-1", "", "", "Groove the pattern, low load."]]}, {"mark": "·", "tiers": [["Med Ball Rotational Throws", "×6/side", "X", "", "", "Heavier ball, full rotation."], ["Med Ball Rotational Throws (light)", "×8/side", "X", "", "", "Speed over load."], ["Med Ball Chest Pass / Slam", "×8", "X", "", "", "No rotation — straight-plane power."]]}, {"mark": "·", "tiers": [["Double-Unders", "×50", "X", "", "", "Your conditioning currency."], ["Double-Unders", "×25", "X", "", "", "Fewer reps, keep clean."], ["Single-Unders", "×75–100", "X", "", "", "Fast singles for the engine."]]}]}, {"items": [{"mark": "C", "tiers": [["Heavy Farmer / Front-rack Carries", "3–4 × 30–40m", "", "as needed", "", "Your sled replacement."], ["Farmer Carries (moderate)", "3–4 × 30–40m", "", "as needed", "", "Tall posture, braced."], ["Suitcase Carry (light)", "3 × 20–30m", "", "as needed", "", "One side; function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function firstInt(s){const m=(s||'').match(/^\s*(\d+)/);return m?parseInt(m[1]):0}
function tierKey(ctx){return 'tspec:tier:'+ctx}
function tickKey(ctx,t){return 'tspec:tick:'+ctx+':'+t}

function slide(t,ctx,tier){
 const [nm,sets,tempo,rest,sub,note]=t;
 let h='<div style="padding:2px 2px 0">';
 h+='<div class="exname"><div class="nm">'+esc(nm)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>';
 h+='<div class="data"><div class="stat reps"><span class="k">Sets × Reps</span><span class="v">'+esc(sets||'—')+'</span></div>';
 if(tempo)h+='<div class="stat"><span class="k">Tempo</span><span class="v">'+esc(tempo)+'</span></div>';
 if(rest)h+='<div class="stat"><span class="k">Rest</span><span class="v">'+esc(rest)+'</span></div>';
 h+='</div>';
 if(note)h+='<div class="note">'+esc(note)+'</div>';
 const n=firstInt(sets);
 if(n&&n<=8){const st=LS.get(tickKey(ctx,tier),[]);h+='<div class="dots"><span class="dlbl">Done</span>';
  for(let i=0;i<n;i++)h+='<button class="dot '+(st[i]?'on':'')+'" data-ctx="'+ctx+'" data-tier="'+tier+'" data-i="'+i+'" aria-label="Set '+(i+1)+'"></button>';
  h+='</div>';}
 return h+'</div>';
}
function exCard(item,ctx){

 let segs='<div class="tierbar">';
 item.tiers.forEach((t,i)=>segs+='<button class="seg '+(i===cur?'on':'')+'" data-ctx="'+ctx+'" data-t="'+i+'">'+TL[i]+'</button>');
 segs+='</div>';
 let slides='';item.tiers.forEach((t,i)=>slides+='<div class="tierslide">'+slide(t,ctx,i)+'</div>');

  '<div class="tierview"><div class="tiertrack" style="transform:translateX('+(-cur*33.3333)+'%)">'+slides+'</div></div></div>';

 if(d.rest&&!d.blocks)return h+'<div class="restday"><div class="big">'+esc(d.name)+'</div><p>'+esc(d.rest)+'</p></div>';
 h+='<div class="tophint"><span class="h">Swipe cards or tap <b>Adv/Easier/Easiest</b></span><button class="resetbtn" id="resetDay">Reset ticks</button></div>';
 if(d.warmup)h+='<div class="warmup"><div class="lbl">Warm-up</div><p>'+esc(d.warmup)+'</p></div>';

 d.blocks.forEach((blk,bi)=>{

   blk.items.forEach((it,ii)=>h+=exCard(it,d.n+'-'+bi+'-'+ii));h+='</div>';}
  else{if(blk.title)h+='<div class="blocklabel"><span class="ss-title">'+esc(blk.title)+'</span></div>';
   blk.items.forEach((it,ii)=>h+=exCard(it,d.n+'-'+bi+'-'+ii));}
 });

}
function renderInfo(){return `
<div class="dayhead"><div class="eyebrow"><span class="kw">REFERENCE</span></div><h2>How it works</h2></div>
<div class="infoblock"><h3 class="coolhead">Levels &amp; memory</h3><div class="def"><div class="desc">Swipe a card or tap <b>Adv / Easier / Easiest</b> to change level — each is a real regression movement. Your chosen level and every set tick are <b>saved on this device</b> and restored next time you open it.</div></div></div>

<div class="def"><div class="term">Tempo e-p-c-p</div><div class="desc">Seconds: eccentric · pause (bottom) · concentric · pause (top). <b>X</b> = explosive.</div></div>
<div class="def"><div class="term">RIR</div><div class="desc">Reps in reserve — lower = harder.</div></div>
<div class="def"><div class="term">⌇ Superset</div><div class="desc">Bracketed moves run back-to-back for the same rounds; rest after the pair.</div></div>
<div class="def"><div class="term">Power work</div><div class="desc">Always quality-based. Stop when height or speed drops.</div></div></div></div>
<div class="infoblock"><h3>The one principle</h3><div class="principle">
<p><b>Lengthened-position bias.</b> Favor the variation that loads the muscle stretched, and control the eccentric to reach it.</p>
<p class="gov">Governor: for hamstrings the stretched position is the most productive AND the most injury-relevant — add range gradually.</p></div></div>
<div class="infoblock"><h3 class="coolhead">Sequencing</h3><ul class="rules">
<li>Three hamstring stressors 48h apart: plyos (D1) → heavy hinge + Nordics (D3) → swings (D5).</li>
<li>Hardest eccentric day (3) → zero-impact recovery (4).</li>
<li>Power before conditioning; power before fatigue.</li>
<li>Sprints: Day 1 only, fresh and unloaded.</li>
<li>Core = anti-movement + rotational power.</li></ul></div>
<div class="infoblock"><h3>Progression</h3><table class="prog">
<tr><th>Block</th><th>Main lifts</th><th>Power</th><th>Metcon</th></tr>
<tr><td>Wk 1–3</td><td>RIR 3–4</td><td>quality</td><td>4 rounds</td></tr>
<tr><td>Wk 4–6</td><td>RIR 2–3 +load</td><td>+1 rep</td><td>5 rounds</td></tr>
<tr><td>Wk 7+</td><td>RIR 1–2</td><td>+height</td><td>cut rest OR add load</td></tr></table>
<p style="font-size:13px;color:var(--muted);margin-top:10px">Deload every 4–6 wks: volume −40%, keep intensity.</p></div>
<div class="infoblock"><h3 class="recoveryhead">4-day version</h3><div class="def"><div class="desc">Keep Days <b>1, 3, 5</b> + one easy aerobic day.</div></div></div>
<div class="infoblock"><h3>Data</h3><button class="dangerbtn" id="wipe">Clear all saved levels &amp; ticks</button></div>`;
}
function select(n){
 current=n;LS.set('tspec:day',n);
 [...tabsEl.children].forEach(t=>t.classList.toggle('active',t.dataset.n==String(n)));
 if(n==='info'){viewEl.innerHTML=renderInfo();const w=document.getElementById('wipe');if(w)w.onclick=wipeAll;}
 else{viewEl.innerHTML=renderDay(DAYS.find(d=>d.n===n));bindDay();}
 viewEl.style.animation='none';void viewEl.offsetWidth;viewEl.style.animation='';
 window.scrollTo(0,0);
}
function setTier(ctx,t){
 t=Math.max(0,Math.min(2,t));LS.set(tierKey(ctx),t);
 const card=viewEl.querySelector('.card[data-ctx="'+ctx+'"]');if(!card)return;
 card.querySelector('.tiertrack').style.transform='translateX('+(-t*33.3333)+'%)';
 card.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('on',i===t));
}
function bindDay(){
 const rd=document.getElementById('resetDay');if(rd)rd.onclick=()=>resetDayTicks();
 viewEl.querySelectorAll('.seg').forEach(s=>s.onclick=()=>setTier(s.dataset.ctx,+s.dataset.t));
 viewEl.querySelectorAll('.dot').forEach(dot=>dot.onclick=()=>{
  const k=tickKey(dot.dataset.ctx,dot.dataset.tier),i=+dot.dataset.i;
  const st=LS.get(k,[]);st[i]=!st[i];LS.set(k,st);
  dot.classList.toggle('on',st[i]);if(st[i]){dot.classList.remove('pop');void dot.offsetWidth;dot.classList.add('pop');}
 });
 viewEl.querySelectorAll('.card').forEach(card=>{
  const ctx=card.dataset.ctx,view=card.querySelector('.tierview'),track=card.querySelector('.tiertrack');
  if(!view||!track)return;let x0=null,y0=null,drag=false,w=0;
  view.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;drag=false;w=view.offsetWidth;},{passive:true});
  view.addEventListener('touchmove',e=>{if(x0==null)return;const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
   if(!drag&&Math.abs(dx)>Math.abs(dy)+4){drag=true;track.classList.add('dragging');}
   if(drag){const cur=LS.get(tierKey(ctx),0);let off=-cur*w+dx;off=Math.max(-2*w,Math.min(0,off));track.style.transform='translateX('+off+'px)';}},{passive:true});
  view.addEventListener('touchend',e=>{if(drag){const dx=e.changedTouches[0].clientX-x0;const cur=LS.get(tierKey(ctx),0);
   let t=cur;if(dx<-40)t=cur+1;else if(dx>40)t=cur-1;track.classList.remove('dragging');track.style.transform='';setTier(ctx,t);}x0=null;drag=false;});
 });
}
function resetDayTicks(){
 const d=DAYS.find(x=>x.n===current);if(!d||!d.blocks)return;
 d.blocks.forEach((blk,bi)=>blk.items.forEach((it,ii)=>{for(let t=0;t<3;t++)LS.del(tickKey(d.n+'-'+bi+'-'+ii,t));}));
 select(current);
}
function wipeAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('tspec:')&&k!=='tspec:day').forEach(k=>localStorage.removeItem(k));}catch(e){}select('info');alert('Cleared.');}
select(current);
</script>
</body></html>
